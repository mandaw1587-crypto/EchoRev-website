name: Daily Email Outreach

on:
  schedule:
    - cron: "0 14 * * 1-5"  # 9am EST Monday–Friday (UTC-5)
  workflow_dispatch:         # Allow manual trigger from GitHub Actions tab

jobs:
  send-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r content-pipeline/email-automation/requirements.txt

      - name: Run email automation
        working-directory: content-pipeline/email-automation
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
        run: python main.py

      - name: Commit updated contacts tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content-pipeline/email-automation/contacts.csv
          git diff --staged --quiet || git commit -m "chore: update contacts tracker [skip ci]"
          git push
